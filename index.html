<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WibeWeather</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <link rel="stylesheet" href="variables.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="container">
            <div class="header__left">
                <a href="" class="logo">WibeWeather</a>
                <div class="search__area">
                    <input class="search__input" type="text" placeholder="Search city...">
                    <button class="search__btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="header__right">
                <button class="header__icon-btn">
                    <span class="notification-badge"></span>
                    🔔
                </button>
                <button class="header__icon-btn">⚙️</button>
                <div class="profile">
                    <div class="profile__info">
                        <span class="profile__name">Guest</span>
                    </div>
                    <img src="https://ui-avatars.com/api/?name=Guest&background=a366ff&color=fff" alt="User"
                        class="profile__img">
                </div>
            </div>
        </div>
    </header>

    <script src="script.js"></script>
</body>

</html>
